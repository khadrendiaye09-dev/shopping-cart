<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<title>Panier</title>
</head>
<body>
<header><nav class="navbar bg-light"><div class="container">Shopping - Total: <span id="total-price">0</span> $</div></nav></header>
<main class="container my-4">
<div class="row">

<div class="col-md-4 card-container">
<div class="card">
<img src="baskets.png" class="card-img-top">
<div class="card-body">
<h5>Baskets</h5><h4 class="unit-price">100 $</h4>
<div><i class="fas fa-plus-circle plus"></i> <span class="quantity">0</span> <i class="fas fa-minus-circle minus"></i></div>
<div><i class="fas fa-trash-alt delete"></i> <i class="fas fa-heart like"></i></div>
</div></div></div>

<div class="col-md-4 card-container">
<div class="card">
<img src="socks.png" class="card-img-top">
<div class="card-body">
<h5>Socks</h5><h4 class="unit-price">20 $</h4>
<div><i class="fas fa-plus-circle plus"></i> <span class="quantity">0</span> <i class="fas fa-minus-circle minus"></i></div>
<div><i class="fas fa-trash-alt delete"></i> <i class="fas fa-heart like"></i></div>
</div></div></div>

<div class="col-md-4 card-container">
<div class="card">
<img src="bag.png" class="card-img-top">
<div class="card-body">
<h5>Bag</h5><h4 class="unit-price">50 $</h4>
<div><i class="fas fa-plus-circle plus"></i> <span class="quantity">0</span> <i class="fas fa-minus-circle minus"></i></div>
<div><i class="fas fa-trash-alt delete"></i> <i class="fas fa-heart like"></i></div>
</div></div></div>

</div>
</main>
<script src="script.js"></script>
</body>
</html>
